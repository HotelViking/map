<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hotel Viking – Area Map</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:14px;background:#17100b;color:#f4ead6;font-family:Georgia,serif}
header{text-align:center;margin:4px auto 14px}h1{margin:0 0 4px;font-size:clamp(23px,4vw,38px);letter-spacing:2px;text-transform:uppercase}header p{margin:0;opacity:.8}
.map{position:relative;width:min(1400px,100%);margin:auto;border:3px solid #8e6b35;border-radius:10px;overflow:hidden;box-shadow:0 12px 40px #0009}
.map img{display:block;width:100%;height:auto}
.pin{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);width:clamp(36px,4vw,58px);height:clamp(36px,4vw,58px);border:3px solid #e0bb70;border-radius:50%;background:radial-gradient(circle at 35% 30%,#8d2920,#2b0c09);color:#fff4d8;font:bold clamp(18px,2vw,27px) Georgia;cursor:pointer;z-index:2;box-shadow:0 3px 10px #000b,inset 0 0 0 2px #ffe6a044;transition:transform .15s}
.pin:hover,.pin:focus-visible{transform:translate(-50%,-50%) scale(1.13);outline:none}
.parking{background:radial-gradient(circle at 35% 30%,#56733b,#182512);font-size:clamp(16px,1.8vw,24px)}
.legend{text-align:center;margin:10px auto;font-size:13px;opacity:.75}
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:18px;background:#000b;z-index:10}.overlay.open{display:flex}
.card{position:relative;width:min(620px,100%);max-height:90vh;overflow:auto;padding:22px;border:2px solid #a98245;border-radius:12px;background:linear-gradient(#332115,#1f140d);box-shadow:0 20px 60px #000c}
.close{position:absolute;top:8px;right:12px;border:0;background:none;color:#f4ead6;font-size:30px;cursor:pointer}
h2{margin:0 38px 10px 0;color:#e6c77c;font-size:27px}#desc{line-height:1.6;white-space:pre-line}#link{display:none;margin-top:14px;color:#e6c77c}
.hint{margin-top:16px;padding-top:12px;border-top:1px solid #d9b66b55;font-size:12px;opacity:.65}
@media(max-width:600px){body{padding:7px}.map{border-width:2px}.card{padding:17px}}
</style></head><body>
<header><h1>Hotel Viking</h1><p>Interactive Area Map</p></header>
<div class="map">
<img src="map.jpg" alt="Hotel Viking area map">
<button class="pin" style="--x:40.4%;--y:52.5%" data-id="1">1</button>
<button class="pin" style="--x:63.5%;--y:41%" data-id="2">2</button>
<button class="pin" style="--x:50.5%;--y:29.1%" data-id="3">3</button>
<button class="pin" style="--x:36%;--y:38.8%" data-id="4">4</button>
<button class="pin" style="--x:70.3%;--y:31%" data-id="5">5</button>
<button class="pin" style="--x:72.8%;--y:87.5%" data-id="6">6</button>
<button class="pin parking" style="--x:18.3%;--y:60%" data-id="P1">P</button>
<button class="pin parking" style="--x:61.4%;--y:56.4%" data-id="P2">P</button>
</div><div class="legend">Tap a numbered marker or parking symbol for information.</div>
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="title"><div class="card">
<button class="close" id="close" aria-label="Close">&times;</button><h2 id="title"></h2><p id="desc"></p><a id="link" target="_blank" rel="noopener">More information</a><div class="hint">Hotel Viking • Hafnarfjörður</div>
</div></div>
<script>
const data={
"1":{title:"Fjörukráin – Restaurant",desc:"Fjörukráin is the Viking Village restaurant, offering a unique Viking-themed dining experience in the heart of Hafnarfjörður.",url:"https://www.fjorukrain.is/"},
"2":{title:"Hotel Viking – Old Wing",desc:"The original wing of Hotel Viking, featuring the traditional Viking atmosphere and character of the hotel."},
"3":{title:"Hotel Viking – New Wing",desc:"The new wing of Hotel Viking, including the Reception and Breakfast Area."},
"4":{title:"Cottages",desc:"Our Viking Village cottages, located within the hotel property."},
"5":{title:"Hot Tub & Sauna",desc:"To find the hot tub and sauna, enter the Old Wing. You will find a room on your left with access to the hot tub and sauna.\n\nHot tub: Open daily from 08:00 to 22:00.\nSauna: Open daily from 18:00 to 22:00."},
"6":{title:"FlyBus Pick-up Point",desc:"FlyBus pick-up point for transfers to Keflavík International Airport (KEF)."},
"P1":{title:"Parking",desc:"Guest parking area."},"P2":{title:"Parking",desc:"Guest parking area."}};
const overlay=document.getElementById("overlay"),title=document.getElementById("title"),desc=document.getElementById("desc"),link=document.getElementById("link");
document.querySelectorAll(".pin").forEach(b=>b.addEventListener("click",()=>{const d=data[b.dataset.id];title.textContent=d.title;desc.textContent=d.desc;if(d.url){link.href=d.url;link.style.display="inline-block"}else{link.removeAttribute("href");link.style.display="none"}overlay.classList.add("open")}));
function shut(){overlay.classList.remove("open")}document.getElementById("close").addEventListener("click",shut);overlay.addEventListener("click",e=>{if(e.target===overlay)shut()});document.addEventListener("keydown",e=>{if(e.key==="Escape")shut()});
</script></body></html>
